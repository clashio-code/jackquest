            if (mx == 0.f && my == 0.f) g_hold = 0.f; else g_hold += dt;
            sp = 200.f + (g_hold > 1.2f ? 1.2f : g_hold) * 500.f;     /* D-pad: makin lama ditahan makin cepat (200 -> 800 px/s) */
            mx *= sp; my *= sp;
