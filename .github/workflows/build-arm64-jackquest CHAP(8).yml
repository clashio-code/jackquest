            if (ax > 0.2f) mx += g_lax * ax * 700.f;                  /* stik kiri (ada deadzone) */
            if (ay > 0.2f) my += g_lay * ay * 700.f;
            g_cx += mx * dt; g_cy += my * dt;
            if (g_cx < 0.f) g_cx = 0.f;
