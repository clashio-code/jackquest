              if (p_SDL_GameControllerClose) p_SDL_GameControllerClose(p->gc);
              memset(p, 0, sizeof *p); g_lax = g_lay = 0.f; local_reset(); return;
            }
            if (type == 0x651u || type == 0x652u) {                                        /* tombol turun / naik */
              int btn = ev[12], down = (type == 0x651u), kc;
              if (down && p_SDL_GameControllerGetButton && p_SDL_GameControllerGetButton(p->gc, 4) && p_SDL_GameControllerGetButton(p->gc, 6)) { L("[pad] SELECT+START -> keluar\n"); g_quit = 1; }
              if (g_cursor_on && btn == 0 && down != g_touch_down) { g_touch_down = down; send_touch(down ? 0 : 1); }   /* A = sentuh di posisi kursor */
              if (g_cursor_on && btn == 1) send_key(down ? 0 : 1, 4);                                                   /* B = tombol Back Android */
              if (btn >= 11 && btn <= 14) {
                if (btn == 11) p->hy = down ? -1 : (p->hy == -1 ? 0 : p->hy);
                if (btn == 12) p->hy = down ? 1 : (p->hy == 1 ? 0 : p->hy);
                if (btn == 13) p->hx = down ? -1 : (p->hx == -1 ? 0 : p->hx);
                if (btn == 14) p->hx = down ? 1 : (p->hx == 1 ? 0 : p->hx);
                if (g_pad_enum_done) pad_hat(p);
              } else if (g_pad_enum_done && (kc = pad_keycode(btn)) != 0) {
                void *fn = down ? n_key_dn : n_key_up;
                if (fn) ((void (*)(void *, void *, int, int))fn)(ENV, g_cls, p->id, kc);
              }
