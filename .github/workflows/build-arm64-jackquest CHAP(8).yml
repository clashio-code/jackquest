            cur_rect(x - 10, y - 3, 21, 7, 0.f); cur_rect(x - 3, y - 10, 7, 21, 0.f);
            cur_rect(x - 9, y - 2, 19, 5, 1.f);  cur_rect(x - 2, y - 9, 5, 19, 1.f);
            if (g_touch_down) cur_rect(x - 1, y - 1, 3, 3, 0.f);   /* titik hitam di tengah saat "menyentuh" */
