            memcpy(&which, ev + 8, 4);
            if (type == 0x653u) { pad_open(which); return; }                              /* SDL_CONTROLLERDEVICEADDED (which = indeks) */
            p = pad_by_inst(which);
            if (!p) return;
            if (type == 0x654u) {                                                          /* SDL_CONTROLLERDEVICEREMOVED (which = instance) */
              L("[pad] dicabut: id=%d\n", p->id);
