          static int gl_init(int want_w, int want_h) {
            static const char *libs[] = { "libSDL2-2.0.so.0", "/usr/lib/libSDL2-2.0.so.0", "libSDL2.so", NULL };
            static const int depths[2] = { 24, 16 };
            int i, t;
            for (i = 0; libs[i] && !sdl_h; i++) { sdl_h = dlopen(libs[i], RTLD_NOW | RTLD_GLOBAL); L("[sdl] dlopen %s : %s\n", libs[i], sdl_h ? "OK" : dlerror()); }
            if (!sdl_h) return -1;
          #define SYM(n) do { *(void **)&p_##n = dlsym(sdl_h, #n); if (!p_##n) { L("[sdl] simbol wajib %s tidak ada\n", #n); return -1; } } while (0)
          #define OPT(n) (*(void **)&p_##n = dlsym(sdl_h, #n))
            SYM(SDL_Init); SYM(SDL_GetError); SYM(SDL_GL_SetAttribute); SYM(SDL_CreateWindow); SYM(SDL_DestroyWindow); SYM(SDL_GL_CreateContext);
            SYM(SDL_GL_SwapWindow); SYM(SDL_GL_GetDrawableSize); SYM(SDL_GetWindowSize); SYM(SDL_GL_SetSwapInterval); SYM(SDL_PollEvent); SYM(SDL_GetTicks);
            OPT(SDL_GetCurrentVideoDriver); OPT(SDL_ShowCursor);
          #undef SYM
            if (p_SDL_Init(0x00000020u) != 0) { L("[sdl] SDL_Init(VIDEO) gagal: %s\n", p_SDL_GetError()); return -1; }
            L("[sdl] video driver: %s\n", p_SDL_GetCurrentVideoDriver && p_SDL_GetCurrentVideoDriver() ? p_SDL_GetCurrentVideoDriver() : "?");
            for (t = 0; t < 2 && !g_ctx; t++) {
              p_SDL_GL_SetAttribute(17, g_gles); p_SDL_GL_SetAttribute(18, g_gles == 1 ? 1 : 0); p_SDL_GL_SetAttribute(21, 4);   /* GLES 1.1 atau 2.0 */
              p_SDL_GL_SetAttribute(0, 8); p_SDL_GL_SetAttribute(1, 8); p_SDL_GL_SetAttribute(2, 8); p_SDL_GL_SetAttribute(3, 0);
              p_SDL_GL_SetAttribute(5, 1); p_SDL_GL_SetAttribute(6, depths[t]); p_SDL_GL_SetAttribute(7, 8);
              g_win = p_SDL_CreateWindow("Jack Quest", 0x1FFF0000, 0x1FFF0000, want_w, want_h, 0x00000002u | 0x00001001u);
              if (!g_win) { L("[sdl] SDL_CreateWindow (depth %d) gagal: %s\n", depths[t], p_SDL_GetError()); continue; }
              g_ctx = p_SDL_GL_CreateContext(g_win);
              if (!g_ctx) { L("[sdl] SDL_GL_CreateContext (GLES%d, depth %d) gagal: %s\n", g_gles, depths[t], p_SDL_GetError()); p_SDL_DestroyWindow(g_win); g_win = NULL; }
              else L("[sdl] konteks GLES%d dibuat (depth %d, stencil 8)\n", g_gles, depths[t]);
            }
            if (!g_ctx) return -1;
            p_SDL_GL_SetSwapInterval(1);
            if (p_SDL_ShowCursor) p_SDL_ShowCursor(0);
            p_SDL_GL_GetDrawableSize(g_win, &g_dw, &g_dh);
            p_SDL_GetWindowSize(g_win, &g_ww, &g_wh);
            if (g_dw <= 0 || g_dh <= 0) { g_dw = want_w; g_dh = want_h; }
            if (g_ww <= 0 || g_wh <= 0) { g_ww = g_dw; g_wh = g_dh; }
            *(void **)&p_glGetString = h_gles ? dlsym(h_gles, "glGetString") : NULL;
            *(void **)&p_glGetError = h_gles ? dlsym(h_gles, "glGetError") : NULL;
            *(void **)&p_glReadPixels = h_gles ? dlsym(h_gles, "glReadPixels") : NULL;
            *(void **)&p_glClearColor = h_gles ? dlsym(h_gles, "glClearColor") : NULL;
            *(void **)&p_glClear = h_gles ? dlsym(h_gles, "glClear") : NULL;
            if (p_glGetString) {
              const char *ext = (const char *)p_glGetString(0x1F03);
              L("[gl] VENDOR   : %s\n", (const char *)p_glGetString(0x1F00));
              L("[gl] RENDERER : %s\n", (const char *)p_glGetString(0x1F01));
              L("[gl] VERSION  : %s\n", (const char *)p_glGetString(0x1F02));
              L("[gl] EXTENSIONS: %.1500s\n", ext ? ext : "(null)");
            }
            L("[gl] drawable %dx%d | jendela %dx%d\n", g_dw, g_dh, g_ww, g_wh);
            return 0;
          }

          /* ---- screenshot (glReadPixels -> BMP 24-bit) + statistik piksel: bukti layar terisi tanpa perlu melihat handheld ---- */
          static void take_shot(int frame) {
            int w = g_dw, h = g_dh, rowb, x, y;
            uint8_t *px, *row; char path[64]; FILE *f; uint8_t hd[54];
            unsigned long long nb = 0, sr = 0, sg = 0, sb = 0, tot;
            uint32_t fs;
            if (!p_glReadPixels || w <= 0 || h <= 0) return;
            px = malloc((size_t)w * (size_t)h * 4);
            if (!px) return;
            p_glReadPixels(0, 0, w, h, 0x1908, 0x1401, px);
            tot = (unsigned long long)w * (unsigned long long)h;
            for (x = 0; (unsigned long long)x < tot; x++) {
              const uint8_t *q = px + (size_t)x * 4;
              if (q[0] | q[1] | q[2]) nb++;
              sr += q[0]; sg += q[1]; sb += q[2];
            }
            snprintf(path, sizeof path, "shot_%04d.bmp", frame);
            L("[shot] frame %d: %d%% piksel non-hitam | rata2 RGB=(%d,%d,%d) -> %s\n", frame, (int)(nb * 100 / tot), (int)(sr / tot), (int)(sg / tot), (int)(sb / tot), path);
            rowb = (w * 3 + 3) & ~3; fs = 54u + (uint32_t)rowb * (uint32_t)h;
            memset(hd, 0, sizeof hd);
            hd[0] = 'B'; hd[1] = 'M'; hd[2] = (uint8_t)fs; hd[3] = (uint8_t)(fs >> 8); hd[4] = (uint8_t)(fs >> 16); hd[5] = (uint8_t)(fs >> 24);
            hd[10] = 54; hd[14] = 40; hd[18] = (uint8_t)w; hd[19] = (uint8_t)(w >> 8); hd[20] = (uint8_t)(w >> 16);
            hd[22] = (uint8_t)h; hd[23] = (uint8_t)(h >> 8); hd[24] = (uint8_t)(h >> 16); hd[26] = 1; hd[28] = 24;
            f = fopen(path, "wb"); row = calloc(1, (size_t)rowb);
            if (f && row) {
              fwrite(hd, 1, 54, f);
              for (y = 0; y < h; y++) {   /* glReadPixels mulai dari baris bawah = urutan BMP bottom-up */
                const uint8_t *q = px + (size_t)y * (size_t)w * 4;
                for (x = 0; x < w; x++) { row[x * 3] = q[x * 4 + 2]; row[x * 3 + 1] = q[x * 4 + 1]; row[x * 3 + 2] = q[x * 4]; }
                fwrite(row, 1, (size_t)rowb, f);
              }
            }
            if (f) fclose(f);
            free(row); free(px);
          }
