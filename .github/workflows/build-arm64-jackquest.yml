          /* ======================= pemuat ELF64 ======================= */
          static int read_file(const char *path, uint8_t **buf, size_t *len) {
            FILE *f = fopen(path, "rb");
            long n;
            if (!f) return -1;
            fseek(f, 0, SEEK_END); n = ftell(f); fseek(f, 0, SEEK_SET);
            *buf = malloc((size_t)n);
            if (!*buf || fread(*buf, 1, (size_t)n, f) != (size_t)n) { fclose(f); return -1; }
            fclose(f); *len = (size_t)n;
            return 0;
          }

          static int load_mod(const char *dir, const char *name, Mod **out) {
            char path[512];
            Mod *m;
            const Elf64_Ehdr *eh;
            const Elf64_Phdr *ph;
            uint64_t minv = ~0ULL, maxv = 0;
            size_t align = 0x4000;
            void *raw;
            int i, dyn_found = 0;
            if (nmods >= MAXMOD) return -1;
            m = &mods[nmods];
            memset(m, 0, sizeof *m);
            snprintf(m->name, sizeof m->name, "%s", name);
            snprintf(path, sizeof path, "%s/%s", dir, name);
            if (read_file(path, &m->file, &m->fsize) != 0) { L("GAGAL membaca %s\n", path); return -1; }
            eh = (const Elf64_Ehdr *)m->file;
            if (m->fsize < sizeof *eh || memcmp(eh->e_ident, ELFMAG, SELFMAG) || eh->e_ident[EI_CLASS] != ELFCLASS64 || eh->e_machine != EM_AARCH64 || eh->e_type != ET_DYN) {
              L("%s: bukan ELF AArch64 shared object\n", name); return -1;
            }
            ph = (const Elf64_Phdr *)(m->file + eh->e_phoff);
            for (i = 0; i < eh->e_phnum; i++) if (ph[i].p_type == PT_LOAD) {
              if (ph[i].p_vaddr < minv) minv = ph[i].p_vaddr;
              if (ph[i].p_vaddr + ph[i].p_memsz > maxv) maxv = ph[i].p_vaddr + ph[i].p_memsz;
              if (ph[i].p_align > align) align = (size_t)ph[i].p_align;
            }
            minv &= ~(uint64_t)(PAGE - 1); maxv = (maxv + PAGE - 1) & ~(uint64_t)(PAGE - 1);
            m->span = (size_t)(maxv - minv);
            raw = mmap(NULL, m->span + align, PROT_READ | PROT_WRITE, MAP_PRIVATE | MAP_ANONYMOUS, -1, 0);
            if (raw == MAP_FAILED) { L("%s: mmap gagal\n", name); return -1; }
            m->base = (uint8_t *)(((uintptr_t)raw + align - 1) & ~(uintptr_t)(align - 1));
            m->bias = (uintptr_t)m->base - (uintptr_t)minv;
            for (i = 0; i < eh->e_phnum; i++) if (ph[i].p_type == PT_LOAD) {
              if ((size_t)ph[i].p_offset + ph[i].p_filesz > m->fsize) { L("%s: segmen melewati ujung file\n", name); return -1; }
              memcpy((void *)(m->bias + ph[i].p_vaddr), m->file + ph[i].p_offset, ph[i].p_filesz);
            }
            for (i = 0; i < eh->e_phnum; i++) {
              if (ph[i].p_type == PT_TLS) { L("%s: punya PT_TLS (belum didukung)\n", name); return -1; }
              if (ph[i].p_type == PT_DYNAMIC) {
                const Elf64_Dyn *d = (const Elf64_Dyn *)(m->bias + ph[i].p_vaddr);
                dyn_found = 1;
                for (; d->d_tag != DT_NULL; d++) {
                  switch (d->d_tag) {
                    case DT_SYMTAB: m->sym = (Elf64_Sym *)(m->bias + d->d_un.d_ptr); break;
                    case DT_STRTAB: m->str = (const char *)(m->bias + d->d_un.d_ptr); break;
                    case DT_RELA: m->rela = (Elf64_Rela *)(m->bias + d->d_un.d_ptr); break;
                    case DT_RELASZ: m->nrela = (uint32_t)(d->d_un.d_val / sizeof(Elf64_Rela)); break;
                    case DT_JMPREL: m->jrela = (Elf64_Rela *)(m->bias + d->d_un.d_ptr); break;
                    case DT_PLTRELSZ: m->njrela = (uint32_t)(d->d_un.d_val / sizeof(Elf64_Rela)); break;
                    case DT_INIT: m->init = d->d_un.d_val; break;
                    case DT_INIT_ARRAY: m->iarr = (uint64_t *)(m->bias + d->d_un.d_ptr); break;
                    case DT_INIT_ARRAYSZ: m->niarr = (uint32_t)(d->d_un.d_val / 8); break;
                    case DT_REL: case 36 /* DT_RELR */: case 0x6000000f: case 0x60000011: case DT_TEXTREL:
                      L("%s: tipe relokasi tidak didukung (tag 0x%x)\n", name, (unsigned)d->d_tag); return -1;
                    default: break;
                  }
                }
              }
            }
            if (!dyn_found || !m->sym || !m->str) { L("%s: section dinamis tidak lengkap\n", name); return -1; }
            if (eh->e_shoff && (size_t)eh->e_shoff + (size_t)eh->e_shnum * sizeof(Elf64_Shdr) <= m->fsize) {
              const Elf64_Shdr *sh = (const Elf64_Shdr *)(m->file + eh->e_shoff);
              for (i = 0; i < eh->e_shnum; i++) if (sh[i].sh_type == SHT_DYNSYM) m->nsym = (int)(sh[i].sh_size / sizeof(Elf64_Sym));
            }
            if (m->nsym <= 0) { L("%s: jumlah simbol tidak diketahui\n", name); return -1; }
            m->rval = calloc((size_t)m->nsym, sizeof(uint64_t));
            m->rhave = calloc((size_t)m->nsym, 1);
            nmods++;
            *out = m;
            L("[load] %s: base=%p span=0x%zx bias=0x%lx simbol=%d rela=%u jmprel=%u init_array=%u\n", name, (void *)m->base, m->span, (unsigned long)m->bias, m->nsym, m->nrela, m->njrela, m->niarr);
            return 0;
          }

          static void *mod_find(const Mod *m, const char *name) {
            int i;
            for (i = 1; i < m->nsym; i++) {
              const Elf64_Sym *s = &m->sym[i];
              if (s->st_shndx != SHN_UNDEF && s->st_name && ELF64_ST_BIND(s->st_info) != STB_LOCAL && strcmp(m->str + s->st_name, name) == 0) return (void *)(m->bias + s->st_value);
            }
            return NULL;
          }

          static uint64_t resolve_uncached(Mod *self, const Elf64_Sym *s) {
            const char *n = self->str + s->st_name;
            int i;
            void *p;
            if (s->st_shndx != SHN_UNDEF) { cnt_self++; return s->st_shndx == SHN_ABS ? s->st_value : (uint64_t)(self->bias + s->st_value); }
            for (i = 0; i < nmods; i++) if (&mods[i] != self && (p = mod_find(&mods[i], n))) { cnt_mod++; return (uint64_t)(uintptr_t)p; }
            for (i = 0; shim[i].name; i++) if (strcmp(shim[i].name, n) == 0) { cnt_shim++; shim_hit[i] = 1; return (uint64_t)(uintptr_t)shim[i].addr; }
            if ((p = dlsym(RTLD_DEFAULT, n))) { cnt_libc++; return (uint64_t)(uintptr_t)p; }
            if (h_gles && (p = dlsym(h_gles, n))) { cnt_gl++; return (uint64_t)(uintptr_t)p; }
            if (h_egl && (p = dlsym(h_egl, n))) { cnt_gl++; return (uint64_t)(uintptr_t)p; }
            if (ELF64_ST_BIND(s->st_info) == STB_WEAK) { cnt_weak0++; return 0; }
            for (i = 0; i < nunres; i++) if (strcmp(unres_name[i], n) == 0) return (uint64_t)(uintptr_t)tstubs[i];
            cnt_unres++;
            if (nunres < MAXUNRES) { unres_name[nunres] = n; return (uint64_t)(uintptr_t)tstubs[nunres++]; }
            return (uint64_t)(uintptr_t)tstubs[MAXUNRES - 1];
          }
          static uint64_t resolve(Mod *self, uint32_t si) {
            if (si == 0) return 0;
            if (!self->rhave[si]) { self->rval[si] = resolve_uncached(self, &self->sym[si]); self->rhave[si] = 1; }
            return self->rval[si];
          }

          static int relocate(Mod *m) {
            int pass, bad = 0;
            unsigned ntype[2048] = {0};
            for (pass = 0; pass < 2; pass++) {
              Elf64_Rela *r = pass ? m->jrela : m->rela;
              uint32_t n = pass ? m->njrela : m->nrela, k;
              for (k = 0; k < n; k++) {
                uint32_t type = (uint32_t)ELF64_R_TYPE(r[k].r_info), si = (uint32_t)ELF64_R_SYM(r[k].r_info);
                uint64_t *where = (uint64_t *)(m->bias + r[k].r_offset);
                if (type < 2048) ntype[type]++;
                switch (type) {
                  case 0: break;                                                     /* R_AARCH64_NONE */
                  case 1027: *where = (uint64_t)m->bias + (uint64_t)r[k].r_addend; break;   /* RELATIVE */
                  case 257: *where = resolve(m, si) + (uint64_t)r[k].r_addend; break;       /* ABS64 */
                  case 1025: case 1026: *where = resolve(m, si) + (uint64_t)r[k].r_addend; break;  /* GLOB_DAT, JUMP_SLOT */
                  default: L("[reloc] %s: tipe tidak didukung %u (offset 0x%llx)\n", m->name, type, (unsigned long long)r[k].r_offset); bad++; break;
                }
              }
            }
            L("[reloc] %s: RELATIVE=%u ABS64=%u GLOB_DAT=%u JUMP_SLOT=%u tak-didukung=%d\n", m->name, ntype[1027], ntype[257], ntype[1025], ntype[1026], bad);
            return bad;
          }

          static void protect(Mod *m) {
            const Elf64_Ehdr *eh = (const Elf64_Ehdr *)m->file;
            const Elf64_Phdr *ph = (const Elf64_Phdr *)(m->file + eh->e_phoff);
            size_t np = m->span / PAGE, p;
            unsigned char *fl = calloc(np, 1);
            int i;
            __builtin___clear_cache((char *)m->base, (char *)m->base + m->span);
            for (i = 0; i < eh->e_phnum; i++) if (ph[i].p_type == PT_LOAD) {
              uintptr_t a = (m->bias + ph[i].p_vaddr) & ~(uintptr_t)(PAGE - 1);
              uintptr_t e = (m->bias + ph[i].p_vaddr + ph[i].p_memsz + PAGE - 1) & ~(uintptr_t)(PAGE - 1);
              unsigned pr = ((ph[i].p_flags & PF_R) ? PROT_READ : 0) | ((ph[i].p_flags & PF_W) ? PROT_WRITE : 0) | ((ph[i].p_flags & PF_X) ? PROT_EXEC : 0);
              for (; a < e; a += PAGE) fl[(a - (uintptr_t)m->base) / PAGE] |= (unsigned char)pr;
            }
            for (p = 0; p < np; ) {
              size_t q = p + 1;
              while (q < np && fl[q] == fl[p]) q++;
              if (fl[p] && mprotect(m->base + p * PAGE, (q - p) * PAGE, fl[p]) != 0) L("[protect] %s: mprotect gagal: %s\n", m->name, strerror(errno));
              p = q;
            }
            free(fl);
          }

          extern char **environ;
          static long long now_ns(void) { struct timespec t; clock_gettime(CLOCK_MONOTONIC, &t); return (long long)t.tv_sec * 1000000000LL + t.tv_nsec; }
          static void run_init(Mod *m) {
            uint32_t i;
            long long t0 = now_ns();
            if (m->init) { L("[init] %s: DT_INIT di 0x%llx\n", m->name, (unsigned long long)m->init); ((void (*)(void))(m->bias + m->init))(); }
            for (i = 0; i < m->niarr; i++) {
              uint64_t f = m->iarr[i];
              if (f == 0 || f == ~0ULL) continue;
              g_cur_init = (int)i;
              if (i % 20 == 0 || i + 1 == m->niarr) L("[init] %s: init_array[%u/%u] = +0x%llx\n", m->name, i, m->niarr, (unsigned long long)(f - m->bias));
              ((void (*)(int, char **, char **))(uintptr_t)f)(0, NULL, environ);
            }
            g_cur_init = -1;
            L("[init] %s: selesai (%u konstruktor, %.1f ms)\n", m->name, m->niarr, (double)(now_ns() - t0) / 1e6);
          }

          static int pint(const char *s) { int v = 0; while (*s >= '0' && *s <= '9') v = v * 10 + (*s++ - '0'); return v; }

          /* titik masuk JNI yang akan dipanggil loader di stage berikutnya (nama persis dari probe: Java_com_yoyogames_runner_RunnerJNILib_*) */
          static const char *const jni_names[] = { "initGLFuncs", "Startup", "Process", "RenderSplash", "Pause", "Resume", "TouchEvent", "KeyEvent", "BackKeyLongPressEvent",
            "onGPDeviceAdded", "onGPDeviceRemoved", "onGPKeyDown", "onGPKeyUp", "onGPNativeAxis", "onGPNativeHat", "onGamepadChange", "registerGamepadConnected",
            "getGuiWidth", "getGuiHeight", "GetSaveFileName", "GetAppID", "SetKeyValue", "CreateVersionDSMap", "OnVirtualKeyboardStatus", "OnVirtualKeyboardTextInserted",
            "HttpResult", "HttpResultString", "HttpProgress", "InputResult", NULL };
          static int jni_check(Mod *m) {
