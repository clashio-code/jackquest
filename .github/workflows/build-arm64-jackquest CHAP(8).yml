          }

          /* ---- panggilan generik ke native Java_* lewat spec ---- */
          static char g_apk[300], g_save[520], g_pkg[] = "ninja.netox.jackquest";
          static float pfloat(const char *s) {
            float sign = 1.f, v = 0.f, d = 0.1f;
            if (*s == '-') { sign = -1.f; s++; }
            while (*s >= '0' && *s <= '9') v = v * 10.f + (float)(*s++ - '0');
            if (*s == '.') { s++; while (*s >= '0' && *s <= '9') { v += (float)(*s++ - '0') * d; d *= 0.1f; } }
            return sign * v;
          }
          static int pint_signed(const char *s) { return *s == '-' ? -pint(s + 1) : pint(s); }
          static void build_args(const char *spec, Args *a) {
            char tok[300]; const char *p = spec;
            memset(a, 0, sizeof *a);
            while (p && *p) {
              size_t n = 0; char kind;
              while (*p && *p != ',' && n + 1 < sizeof tok) tok[n++] = *p++;
              tok[n] = 0; if (*p == ',') p++;
              if (n < 3 || tok[1] != ':') { L("[arg] token '%s' diabaikan (format x:nilai)\n", tok); continue; }
              kind = tok[0];
              if (kind == 'f') { if (a->nf < MAXARGF) a->f[a->nf++] = !strcmp(tok + 2, "@w") ? (float)g_dw : !strcmp(tok + 2, "@h") ? (float)g_dh : pfloat(tok + 2); }
              else if (a->ni < MAXARGI) {
                const char *v = tok + 2; uint64_t x;
                if (kind == 's') x = (uint64_t)(uintptr_t)mk_str(!strcmp(v, "@apk") ? g_apk : !strcmp(v, "@save") ? g_save : !strcmp(v, "@pkg") ? g_pkg : v);
                else if (kind == 'o') x = (uint64_t)(uintptr_t)g_act;
                else x = !strcmp(v, "@w") ? (uint64_t)(int64_t)g_dw : !strcmp(v, "@h") ? (uint64_t)(int64_t)g_dh : (uint64_t)(int64_t)pint_signed(v);
                a->i[a->ni++] = x;
              }
            }
          }
          static int find_apk(char *out, size_t n) {
            DIR *d = opendir("."); struct dirent *e;
            if (!d) return -1;
            while ((e = readdir(d)) != NULL) { size_t l = strlen(e->d_name); if (l > 4 && !strcmp(e->d_name + l - 4, ".apk")) { snprintf(out, n, "%s", e->d_name); closedir(d); return 0; } }
            closedir(d); return -1;
          }

          static int run_stage2(Mod *yy, int timeout) {
            static const char pre[] = "Java_com_yoyogames_runner_RunnerJNILib_";
            char nm[120], cwd[400];
            void *f_init, *f_start, *f_proc, *f_flip;
            Args a_start, a_proc;
            int frame = 0;
            long long t0, tl, tstart;
            snprintf(nm, sizeof nm, "%sinitGLFuncs", pre); f_init = mod_find(yy, nm);
            snprintf(nm, sizeof nm, "%sStartup", pre); f_start = mod_find(yy, nm);
            snprintf(nm, sizeof nm, "%sProcess", pre); f_proc = mod_find(yy, nm);
            snprintf(nm, sizeof nm, "%scanFlip", pre); f_flip = mod_find(yy, nm);
            if (!f_init || !f_start || !f_proc) { L("titik masuk JNI tidak lengkap (initGLFuncs/Startup/Process)\n"); return 1; }
            if (!getcwd(cwd, sizeof cwd)) cwd[0] = 0;
            if (cfg.apk) snprintf(g_apk, sizeof g_apk, "%s/%s", cwd, cfg.apk);
            else if (find_apk(nm, sizeof nm) == 0) snprintf(g_apk, sizeof g_apk, "%s/%s", cwd, nm);
            else g_apk[0] = 0;
            snprintf(g_save, sizeof g_save, "%s/save", cwd); mkdir(g_save, 0755); strncat(g_save, "/", sizeof g_save - strlen(g_save) - 1);   /* Java memberi getFilesDir()+"/" */
            L("\n== stage 2 ==\n[game] APK: %s\n[game] save dir: %s\n", g_apk[0] ? g_apk : "(tidak ada *.apk di folder game)", g_save);

            if (gl_init(cfg.w, cfg.h) != 0) {
              if (g_gles != 1) return 1;
              L("[gl] konteks ES 1.1 TIDAK bisa dibuat di device ini -> coba ES 2.0\n"); g_gles = 2;
              if (gl_init(cfg.w, cfg.h) != 0) return 1;
            }
            jni_init();
            g_yoyo = yy; pad_init();
            g_act = mk_obj("com/yoyogames/runner/RunnerActivity"); ((H *)g_act)->global = 1;
            g_cls = mk_cls("com/yoyogames/runner/RunnerJNILib");

            L("\n== initGLFuncs ==\n");
            g_phase = "initGLFuncs"; alarm((unsigned)(timeout > 0 ? timeout : 60)); t0 = now_ns();
            { int64_t igl = ((int64_t (*)(void *, void *, int))f_init)(ENV, g_cls, g_gles == 2);   /* initGLFuncs(1)=jalur GL2, (0)=jalur GL1 */
              alarm(0); local_reset();
              L("== initGLFuncs(%d) selesai (%.0f ms) -> %d (Java: !=0 berarti renderer GL2) | glGetError=0x%x ==\n", g_gles == 2, (double)(now_ns() - t0) / 1e6, (int)igl, p_glGetError ? p_glGetError() : 0); }

            if (cfg.startup) {
              build_args(cfg.startup, &a_start);
              L("\n== Startup (%d arg integer, %d float) ==\n", a_start.ni, a_start.nf);
              g_phase = "Startup"; alarm((unsigned)(timeout > 0 ? timeout : 60)); t0 = now_ns();
              gcall(f_start, &a_start);
              alarm(0); local_reset();
              L("== Startup selesai (%.0f ms) | glGetError=0x%x ==\n", (double)(now_ns() - t0) / 1e6, p_glGetError ? p_glGetError() : 0);
            } else L("\n(--startup belum diisi: Startup dilewati. Isi spec dari hasil jadx; lihat komentar di atas.)\n");
            if (cfg.process) build_args(cfg.process, &a_proc); else memset(&a_proc, 0, sizeof a_proc);

            L("\n== loop (%d frame%s) ==\n", cfg.frames, cfg.process ? "" : "; tanpa --process: hanya uji layar (warna bergantian)");
            tl = tstart = now_ns();
            while (!g_quit && (cfg.frames <= 0 || frame < cfg.frames)) {
              g_frame = frame;
              if (cfg.maxtime > 0 && now_ns() - tstart > (long long)cfg.maxtime * 1000000000LL) { L("[game] --maxtime %d dtk tercapai\n", cfg.maxtime); break; }
              pump_events(); pad_service();
              g_phase = "Process"; alarm((unsigned)(timeout > 0 ? timeout : 60));
              if (cfg.process && cfg.startup) {
                int tries = 0; int64_t rv;
                do {   /* meniru DemoRenderer.onDrawFrame: ulangi Process sampai canFlip() true */
                  rv = gcall(f_proc, &a_proc); tries++;
                  if (frame < 3 || tries > 1) L("[Process] frame %d (panggilan %d) -> %d\n", frame, tries, (int)rv);
                  if ((int)rv == 0) { L("[game] Process mengembalikan 0 = game minta keluar\n"); g_quit = 1; break; }
                  if ((int)rv == 2) { L("[game] Process mengembalikan 2 = game minta restart (belum ditangani) -> berhenti\n"); g_quit = 1; break; }
                } while (f_flip && !((int (*)(void *, void *))f_flip)(ENV, g_cls) && tries < 16);
              }
              else if (p_glClearColor && p_glClear) { float t = (float)(frame % 60) / 60.f; p_glClearColor(t, 0.2f, 1.f - t, 1.f); p_glClear(0x4100); }
              alarm(0); local_reset();
              if (frame < 5 && p_glGetError) { unsigned e = p_glGetError(); if (e) L("[gl] frame %d: glGetError = 0x%x\n", frame, e); }
              draw_cursor();
              if (shot_wanted(cfg.shots, frame)) take_shot(frame);
              p_SDL_GL_SwapWindow(g_win);
              frame++;
              if (frame % 60 == 0) { long long t = now_ns(); L("[fps] frame %d: %.1f fps\n", frame, 60.0 * 1e9 / (double)(t - tl)); tl = t; }
            }
            L("\n== loop selesai di frame %d ==\n", frame);
            L("[fs] ringkasan: %d akses sukses, %d gagal (lihat baris [fs] di atas)\n", fs_n, fs_fail);
            return 0;
          }


          /* ======================= main ======================= */
          int main(int argc, char **argv) {
            const char *dir = "libs";
            static const char *const order[] = { "libc++_shared.so", "libyoyo.so", NULL };   /* urutan muat: dependensi dulu */
            int stage = 0, timeout = 60, i, do_selftest = 0, bad = 0;
            Mod *mm[2] = { NULL, NULL };
            struct sigaction sa;
            struct utsname u;
            stack_t ss0;

            for (i = 1; i < argc; i++) {
              if (!strcmp(argv[i], "--selftest")) do_selftest = 1;
              else if (!strcmp(argv[i], "--stage") && i + 1 < argc) stage = pint(argv[++i]);
              else if (!strcmp(argv[i], "--timeout") && i + 1 < argc) timeout = pint(argv[++i]);
              else if (cfg_arg(argv, argc, &i)) { }
              else if (argv[i][0] != '-') dir = argv[i];
            }
            g_log = fopen("loader_log.txt", "w");
            L("== jackloader (Milestone 5: stage 0-2 (+audio, gamepad, kursor virtual)) ==\n");
            if (uname(&u) == 0) L("device: %s %s %s | glibc %s\n", u.sysname, u.release, u.machine, gnu_get_libc_version());
            L("libs: %s | stage=%d timeout=%ds\n", dir, stage, timeout);
          #if !defined(__aarch64__)
            L("(bukan aarch64: hanya stage 0 / selftest yang valid; kode game TIDAK akan dijalankan)\n");
            if (stage > 0) stage = 0;
          #endif
            memset(&sa, 0, sizeof sa);
            sa.sa_sigaction = on_sig; sa.sa_flags = SA_SIGINFO | SA_ONSTACK;
            ss0.ss_sp = malloc(1u << 17); ss0.ss_size = 1u << 17; ss0.ss_flags = 0;
            if (ss0.ss_sp) sigaltstack(&ss0, NULL);
            sigaction(SIGSEGV, &sa, NULL); sigaction(SIGBUS, &sa, NULL); sigaction(SIGILL, &sa, NULL);
            sigaction(SIGFPE, &sa, NULL);  sigaction(SIGABRT, &sa, NULL);
            signal(SIGALRM, on_alarm);

            if (do_selftest) return selftest();
            if (tls_guard_check() != 0 && stage > 0) { L("kanari TLS tidak cocok: kode game akan crash 'stack smashing'. Berhenti.\n"); return 1; }

            dlopen("libm.so.6", RTLD_NOW | RTLD_GLOBAL);
            { void *hz = dlopen("libz.so.1", RTLD_NOW | RTLD_GLOBAL); L("zlib (libz.so.1): %s  <- libyoyo mengimpor inflate/deflate/crc32\n", hz ? "OK" : "TIDAK ADA"); }
            h_gles = dlopen("libGLESv2.so.2", RTLD_LAZY | RTLD_LOCAL);
            h_egl = dlopen("libEGL.so.1", RTLD_LAZY | RTLD_LOCAL);
            L("GLESv2: %s | EGL: %s\n", h_gles ? "OK" : "TIDAK ADA", h_egl ? "OK" : "TIDAK ADA");

            /* muat SEMUA modul dulu, baru relokasi: libyoyo mengimpor simbol C++ dari libc++_shared lewat mod_find */
            for (i = 0; order[i]; i++) if (load_mod(dir, order[i], &mm[i]) != 0) return 1;
            for (i = 0; order[i]; i++) { L("\n-- relokasi %s\n", order[i]); if (relocate(mm[i]) != 0) return 1; }
            for (i = 0; order[i]; i++) protect(mm[i]);

            L("\n== ringkasan resolusi simbol (unik per modul, gabungan 2 modul) ==\n");
            L("modul sendiri=%d | antar-modul=%d | shim=%d | glibc=%d | GL/EGL=%d | weak->0=%d | TAK TERSELESAIKAN=%d\n", cnt_self, cnt_mod, cnt_shim, cnt_libc, cnt_gl, cnt_weak0, cnt_unres);
            for (i = 0; i < nunres; i++) L("  TAK TERSELESAIKAN: %s\n", unres_name[i]);
            L("  shim terpakai:");
            for (i = 0; shim[i].name; i++) if (shim_hit[i]) L(" %s", shim[i].name);
            L("\n");
            bad = jni_check(mm[1]);

            if (stage < 1) { L("\n== stage 0 selesai (tidak ada kode game yang dijalankan) ==\n"); return (cnt_unres || bad) ? 1 : 0; }
            if (cnt_unres) { L("\nAda simbol tak terselesaikan -> dibatalkan.\n"); return 1; }
            if (timeout > 0) alarm((unsigned)timeout);

            L("\n== konstruktor (libc++_shared dulu, lalu libyoyo) ==\n");
            for (i = 0; order[i]; i++) { g_phase = "konstruktor"; run_init(mm[i]); }
            alarm(0);
            L("\n== dlopen/dlsym yang diminta game selama konstruktor (%d) ==\n", n_dl);
            for (i = 0; i < n_dl; i++) L("  %s\n", dl_seen[i]);
            L("\n== stage 1 selesai: semua konstruktor jalan tanpa crash ==\n");
            if (stage >= 2) { int rc = run_stage2(mm[1], timeout); L("\n== stage 2 selesai (kode %d) ==\n", rc); fflush(NULL); _exit(rc); }
            fflush(NULL);
            _exit(0);   /* hindari destruktor atexit milik game */
          }
          EOF_C2
          cat > out/JackProbe.sh <<'EOF_SH1'
          #!/bin/bash
          # Probe JackQuest (Milestone 1, arm64 / muOS RG40XX-V). HANYA MEMBACA, tidak mengubah apa pun.
          # Folder data dicari seperti launcher PortMaster lain: /$directory/ports/<nama>

          XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}

          if [ -d "/opt/system/Tools/PortMaster/" ]; then
            controlfolder="/opt/system/Tools/PortMaster"
          elif [ -d "/opt/tools/PortMaster/" ]; then
            controlfolder="/opt/tools/PortMaster"
          elif [ -d "$XDG_DATA_HOME/PortMaster/" ]; then
            controlfolder="$XDG_DATA_HOME/PortMaster"
          else
            controlfolder="/roms/ports/PortMaster"
          fi

          source $controlfolder/control.txt
          [ -f "${controlfolder}/mod_${CFW_NAME}.txt" ] && source "${controlfolder}/mod_${CFW_NAME}.txt"

          GAMEDIR="/$directory/ports/jackquest"
          [ -d "$GAMEDIR" ] || GAMEDIR="$(cd "$(dirname "$0")" && pwd)/jackquest"

          cd "$GAMEDIR" || {
            echo "folder jackquest tidak ketemu. Dicari di: /$directory/ports/jackquest dan di sebelah script ini." > "$(dirname "$0")/probe_error.txt"
            exit 1
          }

          chmod +x ./elfprobe64 2>/dev/null

          {
            echo "GAMEDIR=$GAMEDIR"
            uname -a
            echo "--- CPU"; grep -m3 -iE "model name|Hardware|CPU part|Features" /proc/cpuinfo
            echo "--- glibc"; ldd --version 2>&1 | head -1
            echo "--- RAM"; grep -E "MemTotal|MemAvailable" /proc/meminfo
            echo "--- layar"; cat /sys/class/graphics/fb0/virtual_size 2>/dev/null
            echo "--- lib grafis/audio/zlib/SDL2 di device"
            find /usr/lib /usr/lib64 /lib /usr/local/lib -maxdepth 3 \( -name 'libGLESv2*' -o -name 'libEGL*' -o -name 'libmali*' -o -name 'libSDL2*' -o -name 'libz.so*' -o -name 'libOpenSLES*' -o -name 'libopenal*' \) 2>/dev/null | sort
            echo "--- file di folder game"; ls -la "$GAMEDIR" "$GAMEDIR/libs" 2>&1
          } > probe_stdout.txt 2>&1

          if [ ! -f libs/libyoyo.so ]; then
            echo "libs/libyoyo.so belum ada di $GAMEDIR/libs (ambil dari lib/arm64-v8a di APK)" > probe_report.txt
            cat probe_report.txt >> probe_stdout.txt
            sleep 3
            exit 1
          fi

          ./elfprobe64 libs/libyoyo.so probe_report.txt >> probe_stdout.txt 2>&1
          echo "exit code libyoyo: $?" >> probe_stdout.txt
          if [ -f libs/libc++_shared.so ]; then
            ./elfprobe64 libs/libc++_shared.so probe_report_cxx.txt >> probe_stdout.txt 2>&1
            echo "exit code libc++_shared: $?" >> probe_stdout.txt
          else
            echo "PERINGATAN: libs/libc++_shared.so tidak ada (libyoyo NEEDED libc++_shared.so)" >> probe_stdout.txt
          fi
          sleep 2
          type pm_finish >/dev/null 2>&1 && pm_finish
          EOF_SH1
          cat > out/JackLoader.sh <<'EOF_SH2'
          #!/bin/bash
          # Loader JackQuest (Milestone 2, arm64 / muOS). Argumen dibaca dari loader.args, mis: --stage 1 --timeout 60
          # stage 0 = muat 2 modul + relokasi + laporan simbol | 1 = + jalankan konstruktor libc++_shared lalu libyoyo
          # Folder data dicari seperti launcher PortMaster lain: /$directory/ports/<nama>

          XDG_DATA_HOME=${XDG_DATA_HOME:-$HOME/.local/share}

          if [ -d "/opt/system/Tools/PortMaster/" ]; then
            controlfolder="/opt/system/Tools/PortMaster"
          elif [ -d "/opt/tools/PortMaster/" ]; then
            controlfolder="/opt/tools/PortMaster"
          elif [ -d "$XDG_DATA_HOME/PortMaster/" ]; then
            controlfolder="$XDG_DATA_HOME/PortMaster"
          else
            controlfolder="/roms/ports/PortMaster"
          fi

          source $controlfolder/control.txt
          [ -f "${controlfolder}/mod_${CFW_NAME}.txt" ] && source "${controlfolder}/mod_${CFW_NAME}.txt"

          GAMEDIR="/$directory/ports/jackquest"
          [ -d "$GAMEDIR" ] || GAMEDIR="$(cd "$(dirname "$0")" && pwd)/jackquest"

          cd "$GAMEDIR" || {
            echo "folder jackquest tidak ketemu. Dicari di: /$directory/ports/jackquest dan di sebelah script ini." > "$(dirname "$0")/loader_error.txt"
            exit 1
          }

          chmod +x ./jackloader 2>/dev/null

          if [ ! -f libs/libyoyo.so ] || [ ! -f libs/libc++_shared.so ] || [ ! -f ./jackloader ]; then
            echo "libs/libyoyo.so, libs/libc++_shared.so atau jackloader belum ada di $GAMEDIR" > loader_stdout.txt
            sleep 3
            exit 1
          fi

          export SDL_GAMECONTROLLERCONFIG="$sdl_controllerconfig"
          # hapus log lama supaya tidak tertukar dengan hasil run ini
          rm -f loader_log.txt shot_*.bmp
          LOADER_ARGS="$(cat loader.args 2>/dev/null)"
          echo "GAMEDIR=$GAMEDIR  args=$LOADER_ARGS" > loader_stdout.txt
          ./jackloader libs $LOADER_ARGS >> loader_stdout.txt 2>&1
          echo "exit code: $?" >> loader_stdout.txt
          sleep 2
          type pm_finish >/dev/null 2>&1 && pm_finish
          EOF_SH2
          echo "--stage 2 --gles 2 --timeout 60 --frames 0 --shots 300" > out/jackquest/loader.args
          echo "Taruh libyoyo.so DAN libc++_shared.so (dari lib/arm64-v8a di APK JackQuest) ke folder ini. Jangan di-upload ke GitHub." > out/jackquest/libs/TARUH-LIB-DI-SINI.txt

      - name: Kompilasi (aarch64)
        run: |
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -o out/jackquest/elfprobe64 src/elfprobe64.c -ldl
          aarch64-linux-gnu-gcc -O2 -Wall -Wextra -Wno-format-truncation -o out/jackquest/jackloader src/jackloader.c -ldl -lm -lpthread
          file out/jackquest/elfprobe64 out/jackquest/jackloader || true
          for B in elfprobe64 jackloader; do
            echo "--- $B: library yang dibutuhkan:"
            aarch64-linux-gnu-readelf -d out/jackquest/$B | grep NEEDED
            MAXV=$(aarch64-linux-gnu-readelf -V out/jackquest/$B | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -Vu | tail -1)
            echo "$B butuh GLIBC tertinggi: $MAXV (device muOS: 2.38 atau lebih baru)"
            if [ "$(printf '%s\n%s\n' 2.38 "$MAXV" | sort -V | tail -1)" != "2.38" ]; then
              echo "GAGAL: $B butuh glibc lebih baru dari 2.38. Simbol penyebab:"
              aarch64-linux-gnu-nm -D --undefined-only out/jackquest/$B | grep -E 'GLIBC_2\.(39|[4-9][0-9])'
              exit 1
            fi
          done

      - name: Unggah hasil build
        uses: actions/upload-artifact@v4
        with:
          name: jackquest-arm64
          path: out
