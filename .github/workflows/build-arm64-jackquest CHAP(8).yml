          static void pad_service(void) {   /* thread utama, di antara frame: layani EnumerateGamepadDevices + gerakkan kursor */
            Pad *p; long long t = now_ns(); float dt, mx, my, sp, ax, ay;
            if (g_pad_enum_req) {
