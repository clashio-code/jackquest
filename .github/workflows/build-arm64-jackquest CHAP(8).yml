           *   stage 1 = + jalankan konstruktor (init_array) libc++_shared.so lalu libyoyo.so (kode game mulai jalan; belum ada JNI/grafik/audio)
           *   stage 2 = + jendela SDL2/GLES2, JNIEnv palsu, initGLFuncs, [Startup], loop [Process] (opsi: --gles --frames --shots --startup --process --apk --size --maxtime)
           *   --selftest = uji shim baru (jalan juga di x86)
