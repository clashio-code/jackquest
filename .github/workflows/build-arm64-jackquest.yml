          /* ======================= kanari stack TLS =======================
           * Kode Android arm64 membaca kanari stack dari [tpidr_el0 + 40] (TLS slot 5 bionic). Di glibc slot itu berisi data lain
           * yang bisa berubah -> "stack smashing" palsu. Solusi: blok TLS executable ini (modul TLS pertama, mulai tp+16)
           * diisi konstanta yang sama di semua kata; glibc menyalin gambar awal .tdata ke SETIAP thread baru. */
          #define C8 0x5ad0c0de1badc0deULL
          static __thread uint64_t g_tls_guard[16] __attribute__((aligned(16), used)) = { C8, C8, C8, C8, C8, C8, C8, C8, C8, C8, C8, C8, C8, C8, C8, C8 };

          static int tls_guard_check(void) {
          #if defined(__aarch64__)
            uint64_t tp, v;
            __asm__ volatile("mrs %0, tpidr_el0" : "=r"(tp));
            v = *(volatile uint64_t *)(tp + 40);
            L("[tls] kanari di tp+40 = 0x%llx (harus 0x%llx) | blok TLS kita mulai di tp+%lld -> %s\n", (unsigned long long)v, (unsigned long long)C8,
              (long long)((uintptr_t)&g_tls_guard[0] - (uintptr_t)tp), v == C8 ? "OK" : "TIDAK COCOK");
            return v == C8 ? 0 : -1;
          #else
            (void)g_tls_guard;
            L("[tls] (bukan aarch64: pengecekan kanari dilewati)\n");
            return 0;
          #endif
          }

          /* ======================= diagnostik crash ======================= */
          static const char *game_sym(const Mod *m, uintptr_t a, uint64_t *delta) {
            uint64_t off = (uint64_t)(a - m->bias), best = 0; const char *nm = NULL; int i;
            for (i = 1; i < m->nsym; i++) {
              const Elf64_Sym *y = &m->sym[i];
              if (y->st_shndx == SHN_UNDEF || !y->st_name || ELF64_ST_TYPE(y->st_info) != STT_FUNC) continue;
              if (y->st_value <= off && y->st_value >= best) { best = y->st_value; nm = m->str + y->st_name; }
            }
            *delta = off - best;
            return nm;
          }
          static void describe(uintptr_t a) {
            int i;
            for (i = 0; i < nmods; i++)
              if (a >= (uintptr_t)mods[i].base && a < (uintptr_t)mods[i].base + mods[i].span) {
                uint64_t d = 0; const char *nm = game_sym(&mods[i], a, &d);
                L("    -> %s + 0x%llx  [%s+0x%llx]\n", mods[i].name, (unsigned long long)(a - mods[i].bias), nm ? nm : "?", (unsigned long long)d);
              }
          }
          /* parse hex manual: sscanf/strtoul di glibc build >=2.38 terikat ke simbol GLIBC_2.38 */
          static int maps_range(const char *ln, uintptr_t *lo, uintptr_t *hi) {
            const char *q = ln;
            *lo = 0; *hi = 0;
            while ((*q >= '0' && *q <= '9') || (*q >= 'a' && *q <= 'f')) *lo = *lo * 16 + (uintptr_t)(*q <= '9' ? *q - '0' : *q - 'a' + 10), q++;
            if (*q == '-') q++;
            while ((*q >= '0' && *q <= '9') || (*q >= 'a' && *q <= 'f')) *hi = *hi * 16 + (uintptr_t)(*q <= '9' ? *q - '0' : *q - 'a' + 10), q++;
            return *hi != 0;
          }
          static void map_of(const char *tag, uintptr_t a) {
            FILE *m = fopen("/proc/self/maps", "r");
            char ln[512];
            uintptr_t lo, hi;
            if (!m) return;
            while (fgets(ln, sizeof ln, m)) {
              if (maps_range(ln, &lo, &hi) && a >= lo && a < hi) {
                char *nl = strchr(ln, '\n'); if (nl) *nl = 0;
                L("    %s in map: %s\n", tag, ln);
                break;
              }
            }
            fclose(m);
          }
          /* kandidat return address di modul game, dipindai dari sp ke atas (maks maxwords kata). Berguna saat abort karena exception C++ tak tertangkap. */
          static void stack_candidates(uintptr_t sp, int maxwords, int maxshow, const char *tag) {
            uintptr_t end = sp + (uintptr_t)maxwords * 8, lo, hi;
            const uintptr_t *s = (const uintptr_t *)sp;
            int k, shown = 0;
            FILE *m = fopen("/proc/self/maps", "r");
            char ln[512];
            if (m) {
              while (fgets(ln, sizeof ln, m)) {
                if (maps_range(ln, &lo, &hi) && sp >= lo && sp < hi) { if (hi < end) end = hi; break; }
              }
              fclose(m);
            }
            L("  [stack%s] pindai sp=%p .. %p (%ld kata) untuk return address di modul game:\n", tag, (void *)sp, (void *)end, (long)((end - sp) / 8));
            for (k = 0; sp + (uintptr_t)k * 8 + 8 <= end && shown < maxshow; k++) {
              int i;
              for (i = 0; i < nmods; i++)
                if (s[k] >= (uintptr_t)mods[i].base && s[k] < (uintptr_t)mods[i].base + mods[i].span) {
                  uint64_t d = 0; const char *nm = game_sym(&mods[i], s[k], &d);
                  L("    sp+%d: %s + 0x%llx  [%s+0x%llx]\n", k * 8, mods[i].name, (unsigned long long)(s[k] - mods[i].bias), nm ? nm : "?", (unsigned long long)d);
                  shown++; break;
                }
            }
            if (!shown) L("    (tidak ada)\n");
          }
          static volatile int g_in_sig;
          static void on_sig(int sig, siginfo_t *si, void *ctx) {
            ucontext_t *uc = (ucontext_t *)ctx;
            uintptr_t pc = 0, lr = 0, sp = 0;
            if (g_in_sig++) _exit(128 + sig);   /* crash di dalam handler (mis. heap rusak): jangan berulang/menggantung */
            (void)uc; (void)sp; (void)lr;
          #if defined(__aarch64__)
            pc = (uintptr_t)uc->uc_mcontext.pc; lr = (uintptr_t)uc->uc_mcontext.regs[30]; sp = (uintptr_t)uc->uc_mcontext.sp;
          #endif
            L("\n*** SINYAL %d  addr=%p  pc=%p  lr=%p  | fase: %s (frame %d) | konstruktor init_array: %d ***\n", sig, si->si_addr, (void *)pc, (void *)lr, g_phase, g_frame, g_cur_init);
            describe(pc); describe(lr);
          #if defined(__aarch64__)
            {   /* backtrace lewat rantai frame-pointer (x29): tiap frame = {fp_sebelumnya, return_address} */
              uintptr_t fp = (uintptr_t)uc->uc_mcontext.regs[29];
              int n, k;
              L("  [bt] (aman, tanpa malloc) rantai frame-pointer dari x29=%p:\n", (void *)fp);
              for (n = 0; n < 32 && fp && !(fp & 7) && fp >= sp - 4096 && fp < sp + 0x400000; n++) {
                const uintptr_t *fr = (const uintptr_t *)fp;
                uintptr_t ra = fr[1], nfp = fr[0];
                L("   #%d ra=%p\n", n, (void *)ra);
                describe(ra);
                if (nfp <= fp) break;
                fp = nfp;
              }
              for (k = 0; k < 30; k += 4)
                L("    x%-2d=%016llx x%-2d=%016llx x%-2d=%016llx x%-2d=%016llx\n", k, (unsigned long long)uc->uc_mcontext.regs[k], k + 1, (unsigned long long)uc->uc_mcontext.regs[k + 1],
                  k + 2, (unsigned long long)uc->uc_mcontext.regs[k + 2], k + 3 < 30 ? k + 3 : 29, (unsigned long long)uc->uc_mcontext.regs[k + 3 < 30 ? k + 3 : 29]);
              L("    sp=%016llx\n", (unsigned long long)sp);
              if (pc > 64) {  /* kata instruksi di sekitar pc untuk disassembly offline */
                const uint32_t *c = (const uint32_t *)((pc & ~(uintptr_t)3) - 48);
                L("  [code] 12 kata sebelum pc + pc + 3 sesudah (mulai %p):", (const void *)c);
                for (k = 0; k < 16; k++) { if (k % 4 == 0) L("\n   "); L(" %08x", c[k]); }
                L("\n");
              }
              stack_candidates(sp, 24576, 80, "");
            }
          #endif
            map_of("pc", pc); map_of("lr", lr);
            _exit(128 + sig);
          }
          static void on_alarm(int sig) { (void)sig; L("\n*** WATCHDOG: waktu habis | fase: %s (frame %d) | konstruktor %d, proses dihentikan ***\n", g_phase, g_frame, g_cur_init); _exit(4); }

          /* ======================= shim bionic -> glibc ======================= */
          /* bionic LP64: sizeof(FILE)=152; __sF = array 3 FILE (stdin, stdout, stderr). libc++ (iostream) memakai &__sF[n] -> petakan ke stdio glibc. */
          #define BSF 152
          static char bionic_sF[3 * BSF];
          static int is_sF(FILE *f) { uintptr_t a = (uintptr_t)f, b = (uintptr_t)bionic_sF; return a >= b && a < b + sizeof bionic_sF; }
          static FILE *xf(FILE *f) {
            if (is_sF(f)) { unsigned i = (unsigned)(((uintptr_t)f - (uintptr_t)bionic_sF) / BSF); return i == 0 ? stdin : i == 1 ? stdout : stderr; }
            return f;
          }
          static int b_fputc(int c, FILE *f) { return fputc(c, xf(f)); }
          static int b_fflush(FILE *f) { return fflush(f ? xf(f) : NULL); }
          static size_t b_fwrite(const void *p, size_t s, size_t n, FILE *f) { return fwrite(p, s, n, xf(f)); }
          static size_t b_fread(void *p, size_t s, size_t n, FILE *f) { return fread(p, s, n, xf(f)); }
          static int b_vfprintf(FILE *f, const char *fmt, va_list ap) { return vfprintf(xf(f), fmt, ap); }
          static int b_feof(FILE *f) { return feof(xf(f)); }
          static int b_ferror(FILE *f) { return ferror(xf(f)); }
          static int b_getc(FILE *f) { return getc(xf(f)); }
          static int b_fgetc(FILE *f) { return fgetc(xf(f)); }
          static int b_ungetc(int c, FILE *f) { return ungetc(c, xf(f)); }
          static int b_fseek(FILE *f, long o, int w) { return fseek(xf(f), o, w); }
          static long b_ftell(FILE *f) { return ftell(xf(f)); }
          __attribute__((noinline)) static int b_fclose(FILE *f) { return is_sF(f) ? 0 : fclose(f); }   /* jangan pernah menutup stdout/stderr asli */

          static int *b_errno(void) { return &errno; }
          static int g_droid_n;
          static int b_android_log_write(int prio, const char *tag, const char *text) {
            if (g_droid_n++ < 4000) L("[droid %d/%s] %s%s", prio, tag ? tag : "?", text ? text : "", (text && text[0] && text[strlen(text) - 1] == '\n') ? "" : "\n");
            return 1;
