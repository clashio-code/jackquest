            if (g_cy < 0.f) g_cy = 0.f;
          if (g_cy > (float)(g_dh - 1)) g_cy = (float)(g_dh - 1);
            if (g_touch_down && (mx != 0.f || my != 0.f)) send_touch(2);   /* geser sambil menahan A */
            local_reset();
          }
