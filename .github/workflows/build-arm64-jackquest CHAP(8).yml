          extern int __xpg_strerror_r(int, char *, size_t);
          static int b_strerror_r(int e, char *buf, size_t n) { return __xpg_strerror_r(e, buf, n); }  /* bionic = versi XSI (int) */

          /* dlopen/dlsym dari game: nama lib Android dipetakan ke nama glibc; semua dicatat supaya kelihatan apa yang diminta game */
          static char dl_seen[MAXDL][120];
          static int n_dl;
          static void dl_note(const char *what, const char *a, const char *b, void *r) {
            if (n_dl < MAXDL) snprintf(dl_seen[n_dl++], sizeof dl_seen[0], "%s(%s%s%s) -> %p", what, a ? a : "NULL", b ? ", " : "", b ? b : "", r);
            L("[dl] %s(%s%s%s) -> %p\n", what, a ? a : "NULL", b ? ", " : "", b ? b : "", r);
          }
          static void *b_dlopen(const char *name, int flags) {
            const char *m = name;
            void *h;
            if (name) {
              if (!strcmp(name, "libEGL.so")) m = "libEGL.so.1";
              else if (!strcmp(name, "libGLESv2.so")) m = "libGLESv2.so.2";
              else if (!strcmp(name, "libc.so") || !strcmp(name, "libdl.so")) m = "libc.so.6";
              else if (!strcmp(name, "libm.so")) m = "libm.so.6";
            }
            { int mi;
              for (mi = 0; name && mi < nmods; mi++) if (!strcmp(name, mods[mi].name)) { dl_note("dlopen", name, "(modul sendiri)", (void *)&mods[mi]); return (void *)&mods[mi]; } }
            h = dlopen(m, flags ? flags : RTLD_NOW);
            dl_note("dlopen", name, NULL, h);
            return h;
          }
          static void *b_dlsym(void *h, const char *sym) {
            void *r = NULL;
            if (sym && (const Mod *)h >= mods && (const Mod *)h < mods + nmods) { r = mod_find((const Mod *)h, sym); dl_note("dlsym", sym, "(modul sendiri)", r); return r; }
            if (sym && h == NULL) { int mi; for (mi = 0; mi < nmods && !r; mi++) r = mod_find(&mods[mi], sym); }
            if (!r) r = dlsym(h, sym);
            if (!r && h_gles && sym) r = dlsym(h_gles, sym);
            if (!r && h_egl && sym) r = dlsym(h_egl, sym);
            dl_note("dlsym", sym, NULL, r);
            return r;
          }
          static int b_dlclose(void *h) { (void)h; return 0; }
          static char *b_dlerror(void) { return dlerror(); }

          /* dl_iterate_phdr: unwinder C++ (libunwind statis di libKumoGame) memakai ini untuk mencari .eh_frame. Modul yang kita muat
           * sendiri TIDAK terlihat oleh glibc, jadi laporkan sendiri lalu lanjut ke daftar glibc. */
          static int b_dl_iterate_phdr(int (*cb)(struct dl_phdr_info *, size_t, void *), void *data) {
            int i, r;
            for (i = 0; i < nmods; i++) {
              const Elf64_Ehdr *eh = (const Elf64_Ehdr *)mods[i].file;
              struct dl_phdr_info info;
              memset(&info, 0, sizeof info);
              info.dlpi_addr = (ElfW(Addr))mods[i].bias;
              info.dlpi_name = mods[i].name;
              info.dlpi_phdr = (const ElfW(Phdr) *)(mods[i].file + eh->e_phoff);
              info.dlpi_phnum = eh->e_phnum;
              info.dlpi_adds = (unsigned long long)nmods;
              r = cb(&info, sizeof info, data);
              if (r) return r;
            }
            return dl_iterate_phdr(cb, data);
          }


          /* ---- shim tambahan JackQuest (libyoyo + libc++_shared memakai stdio ber-FILE*, fgetpos, select/fortify) ---- */
          /* DIAGNOSTIK SEMENTARA: memcpy dicurigai di crash Process frame 0. Log hanya kalau argumen tidak masuk akal (maks 8x). */
          static void *b_memcpy(void *d, const void *s, size_t n) {
            static volatile int shown;
            if ((n > 0x10000000u || (n && ((uintptr_t)d < 0x10000 || (uintptr_t)s < 0x10000))) && shown < 8) {
              uintptr_t ra = (uintptr_t)__builtin_return_address(0);
              int i, found = 0;
              shown++;
              for (i = 0; i < nmods; i++) if (ra >= (uintptr_t)mods[i].base && ra < (uintptr_t)mods[i].base + mods[i].span) { L("[memcpy-AWAS] dst=%p src=%p n=%zu dipanggil dari %s+0x%llx\n", d, s, n, mods[i].name, (unsigned long long)(ra - (uintptr_t)mods[i].base)); found = 1; }
